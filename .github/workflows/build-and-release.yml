name: Build And Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: foldbox-windows-x64
            artifact_path: dist/foldbox-windows-x64.exe
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: foldbox-linux-x64
            artifact_path: dist/foldbox-linux-x64.tar.gz
          - label: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact_name: foldbox-macos-arm64
            artifact_path: dist/foldbox-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build Rust release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Target '${{ matrix.target }}' -Profile release -OutputDir dist

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh '${{ matrix.target }}' release dist

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh '${{ matrix.target }}' release dist

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdoutPath = Join-Path $PWD "windows-help.txt"
          $stderrPath = Join-Path $PWD "windows-help.err.txt"
          $process = Start-Process -FilePath "dist\foldbox-windows-x64.exe" -ArgumentList "--help" -NoNewWindow -PassThru -Wait -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if ($process.ExitCode -ne 0) {
            $stderr = if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath -Raw } else { "" }
            throw "Windows artifact exited with code $($process.ExitCode). $stderr"
          }
          $help = Get-Content -LiteralPath $stdoutPath -Raw
          if ($help -notmatch "Usage:") {
            throw "Windows artifact did not print usage text."
          }

      - name: Smoke test Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir -p smoke
          tar -xzf dist/foldbox-linux-x64.tar.gz -C smoke
          chmod +x smoke/foldbox-linux-x64/foldbox
          help_output="$(smoke/foldbox-linux-x64/foldbox --help)"
          [[ "${help_output}" == *"Usage:"* ]]

      - name: Smoke test macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir -p smoke
          tar -xzf dist/foldbox-macos-arm64.tar.gz -C smoke
          chmod +x smoke/foldbox-macos-arm64/foldbox
          help_output="$(smoke/foldbox-macos-arm64/foldbox --help)"
          [[ "${help_output}" == *"Usage:"* ]]

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: foldbox-windows-x64
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: foldbox-linux-x64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: foldbox-macos-arm64
          path: dist

      - name: Remove stale version assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false
          fi

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Release ${{ github.ref_name }}

          - Windows x64: `foldbox-windows-x64.exe`
          - Linux x64: `foldbox-linux-x64.tar.gz`
          - macOS arm64: `foldbox-macos-arm64.tar.gz`
          - FoldBox is a pure CLI file wrapper.
          - `pack` creates a `.box.txt` text file and `unpack` restores the original file.
          - Run `foldbox --help` to view usage.
          EOF
          gh release create "${{ github.ref_name }}" \
            dist/foldbox-windows-x64.exe \
            dist/foldbox-linux-x64.tar.gz \
            dist/foldbox-macos-arm64.tar.gz \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --latest
