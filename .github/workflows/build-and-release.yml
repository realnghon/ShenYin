name: Build And Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: foldbox-windows-x64
            artifact_path: dist/foldbox-windows-x64.exe
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: foldbox-linux-x64
            artifact_path: dist/foldbox-linux-x64.tar.gz
          - label: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact_name: foldbox-macos-arm64
            artifact_path: dist/foldbox-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build Rust release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Target '${{ matrix.target }}' -Profile release -OutputDir dist

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh '${{ matrix.target }}' release dist

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh '${{ matrix.target }}' release dist

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist\foldbox-windows-x64.exe" --help | Out-Null

      - name: Smoke test Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir -p smoke
          tar -xzf dist/foldbox-linux-x64.tar.gz -C smoke
          chmod +x smoke/foldbox-linux-x64/foldbox
          smoke/foldbox-linux-x64/foldbox --help >/dev/null

      - name: Smoke test macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir -p smoke
          tar -xzf dist/foldbox-macos-arm64.tar.gz -C smoke
          chmod +x smoke/foldbox-macos-arm64/foldbox
          smoke/foldbox-macos-arm64/foldbox --help >/dev/null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: foldbox-windows-x64
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: foldbox-linux-x64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: foldbox-macos-arm64
          path: dist

      - name: Remove stale version assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do
            gh release delete-asset "${{ github.ref_name }}" "$asset" --yes
          done || true

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            - Windows x64: `foldbox-windows-x64.exe`
            - Linux x64: `foldbox-linux-x64.tar.gz`
            - macOS arm64: `foldbox-macos-arm64.tar.gz`
            - FoldBox 是一个纯 CLI 文件封装工具。
            - `pack` 生成 `.box.txt` 文本文件，`unpack` 还原原始文件。
            - 运行 `foldbox --help` 查看命令用法。
          overwrite_files: true
          make_latest: true
          files: |
            dist/foldbox-windows-x64.exe
            dist/foldbox-linux-x64.tar.gz
            dist/foldbox-macos-arm64.tar.gz
